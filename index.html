  <!-- Form and Interaction Runtime -->
  <script>
    (function() {
      // Lazy-load reCAPTCHA v2 script
      var recaptchaLoaded = false;
      function loadRecaptcha() {
        if (recaptchaLoaded) return;
        recaptchaLoaded = true;
        var script = document.createElement('script');
        script.src = 'https://www.google.com/recaptcha/api.js';
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
      }

      var contactForm = document.getElementById('contact-form');
      if (contactForm) {
        contactForm.addEventListener('focusin', function() {
          loadRecaptcha();
        }, { once: true });

        contactForm.addEventListener('submit', function(e) {
          e.preventDefault();
          loadRecaptcha();

          var cfg = window.KORA_SITE_CONFIG || window.KORA_CONFIG || {};
          var apiBaseUrl = (cfg.apiBaseUrl || '').replace(/\/+$/, '');
          var businessId = cfg.businessId || '0d3158d5-cdb4-4908-b0bf-9aab2692362b';
          var statusEl = document.getElementById('form-status');
          var submitBtn = document.getElementById('contact-submit');

          var nameInput = document.getElementById('contact-name');
          var emailInput = document.getElementById('contact-email');
          var messageInput = document.getElementById('contact-message');

          var name = (nameInput.value || '').trim();
          var email = (emailInput.value || '').trim();
          var message = (messageInput.value || '').trim();

          // Client-side validation
          if (!name || !email || !message) {
            statusEl.textContent = 'Please fill in your name, email, and message.';
            return;
          }

          var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailPattern.test(email)) {
            statusEl.textContent = 'Please provide a valid email address.';
            return;
          }

          if (typeof grecaptcha === 'undefined') {
            statusEl.textContent = 'Security check loading — please try again.';
            return;
          }

          var captchaToken = grecaptcha.getResponse();
          if (!captchaToken) {
            statusEl.textContent = 'Please complete the security check.';
            return;
          }

          submitBtn.disabled = true;
          statusEl.textContent = 'Sending message...';

          var payload = {
            business_id: businessId,
            form_type: 'contact',
            form_data: {
              name: name,
              email: email,
              message: message
            },
            submitter_email: email,
            captcha_token: captchaToken
          };

          fetch(apiBaseUrl + '/api/v1/public/forms/submit', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          })
          .then(function(res) {
            if (!res.ok) {
              throw new Error('Form submission failed');
            }
            return res.json().catch(function() { return {}; });
          })
          .then(function() {
            statusEl.textContent = 'Thank you. Your message has been sent.';
            contactForm.reset();
            if (typeof grecaptcha !== 'undefined' && grecaptcha.reset) {
              grecaptcha.reset();
            }
          })
          .catch(function(err) {
            console.error('Submission error:', err);
            statusEl.textContent = 'Unable to send message right now. Please try again shortly.';
          })
          .finally(function() {
            submitBtn.disabled = false;
          });
        });
      }

      // Smooth scroll for in-page anchors
      document.querySelectorAll('a[href^="#"]').forEach(function(anchor) {
        anchor.addEventListener('click', function(e) {
          var targetId = this.getAttribute('href').slice(1);
          var targetEl = document.getElementById(targetId);
          if (targetEl) {
            e.preventDefault();
            targetEl.scrollIntoView({ behavior: 'smooth' });
          }
        });
      });
    })();
  </script>
